<!DOCTYPE html>
<html lang="en">
<head>

<body class="fondo">
    <div class="centrado">
        <button type="button" class="back" onclick="IR('index')">⬅</button><h1 class="titulo">Temporizador</h1>

        <input type="radio" id="opcionseg" name="eleccion" value="2">

        <br><br>
        <button type="button" onclick="TEMPORIZADOR()" class="boton">Listo</button>
        <button type="button"  onclick="REFRESH()" class="boton">Nuevo</button>
    </div>
    <div id="temporizador" class="centrado">
    </div>
