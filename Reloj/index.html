<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Multifuncional</title>
    <!--ARCHIVOS UWU-->
    <script src="script.js" async defer></script>
    <link rel="stylesheet" href="styles.css">
    <!--RECONECCIONES-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body class="fondo">
    <div class="centrado">
        <h1 class="titulo">Reloj Multifuncional.com</h1>
    </div>
    <div class="true-center">
        <button type="button" onclick="IR('hora')" class="boton-main">Hora <br>
            <img src="img/reloj.png" alt="hora" class="boton-img">
        </button>
        <button type="button" onclick="IR('cronometro')" class="boton-main">Cronometro <br>
            <img src="img/cronometro.png" alt="cronometro" class="boton-img">
        </button>
        <br>
        <br>
        <button type="button" onclick="IR('temporizador')" class="boton-main">Temporizador <br>
            <img src="img/temporizador.png" alt="temporizador" class="boton-img">
        </button>
        <button type="button" onclick="IR('pomodoro')" class="boton-main">Pomodoro <br>
            <img src="img/pomodoro.png" alt="pomodoro" class="boton-img">
        </button>
    </div>
</body>
</html>
